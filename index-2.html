if(!data.session)msg("e","Almost there! Confirm your email, then log in",1)}
else{const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)msg("e",error.message)}}}

/* ---------- DATA ---------- */
async function loadFriends(){const{data:fr,error}=await sb.from("friendships").select("*");if(error)throw error;
const ids=[...new Set((fr||[]).flatMap(f=>[f.requester,f.addressee]))].filter(i=>i!==me.id);
let pm={};if(ids.length){const{data}=await sb.from("profiles").select("*").in("id",ids);(data||[]).forEach(p=>pm[p.id]=p)}
return(fr||[]).map(f=>({...f,other:pm[f.requester===me.id?f.addressee:f.requester]}))}

/* ---------- APP SHELL ---------- */
async function boot(){
const{data}=await sb.auth.getSession();me=data.session?.user||null;
if(!me)return authView();
const{data:p}=await sb.from("profiles").select("*").eq("id",me.id).single();prof=p;
if(ch)sb.removeChannel(ch);
ch=sb.channel("inbox-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`recipient=eq.${me.id}`},async e=>{
if(peer&&e.new.sender===peer.id){addBubble(e.new);sb.rpc("mark_read",{other:peer.id})}else{toast("New message")}})
.on("postgres_changes",{event:"*",schema:"public",table:"friendships"},()=>{if(!peer&&tab!=="profile")render()}).subscribe();
render()}
function toast(t){const d=document.createElement("div");d.className="g pad";d.style.cssText="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2500)}
function render(){if(!me)return authView();if(peer)return chatView();
A.innerHTML=`<div class="main" id="v"></div><nav class="g">${[["chats","Chats"],["friends","Friends"],["profile","Me"]].map(([k,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</nav>`;
A.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});({chats:chatsTab,friends:friendsTab,profile:profileTab})[tab]()}

async function chatsTab(){const v=$("#v");v.innerHTML=`<h1>Chats</h1><p class="mut">Loading…</p>`;
try{const fs=(await loadFriends()).filter(f=>f.status==="accepted"&&f.other);
v.innerHTML=`<h1>Chats</h1>`+(fs.length?fs.map(f=>`<div class="g item row" data-id="${f.other.id}">${av(f.other)}<div><b>${esc(f.other.display_name)}</b><br><small>@${esc(f.other.username)}</small></div></div>`).join(""):`<div class="g pad mut">No chats yet. Add a friend in the Friends tab and they'll show up here</div>`);
v.querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>{peer=fs.find(f=>f.other.id===e.dataset.id).other;render()})}catch(e){v.innerHTML=`<div class="err">Couldn't load: ${esc(e.message)}</div>`}}

async function friendsTab(){const v=$("#v");
v.innerHTML=`<h1>Friends</h1><div class="g pad"><div class="row"><input id="q" placeholder="Search exact username" autocapitalize="none"><button id="sq">Go</button></div><div id="sr"></div></div><div id="fl"><p class="mut">Loading…</p></div>`;
$("#sq").onclick=async()=>{const q=$("#q").value.trim().toLowerCase().replace(/^@/,"");if(!q)return;
const{data}=await sb.from("profiles").select("*").ilike("username",q+"%").neq("id",me.id).limit(8);
$("#sr").innerHTML=(data||[]).map(p=>`<div class="row item">${av(p)}<div class="sp"><b>${esc(p.display_name)}</b><br><small>@${esc(p.username)}</small></div><button data-add="${p.id}">Add</button></div>`).join("")||`<p class="mut">No one found.</p>`;
$("#sr").querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{const{error}=await sb.from("friendships").insert({requester:me.id,addressee:b.dataset.add});b.textContent=error?(error.code==="23505"?"Already sent":"Error"):"Sent ✓";b.disabled=true;if(!error)friendsList()})};
$("#q").onkeydown=e=>{if(e.key==="Enter")$("#sq").click()};friendsList()}
async function friendsList(){const el=$("#fl");if(!el)return;
try{const fs=await loadFriends(),inc=fs.filter(f=>f.status==="pending"&&f.addressee===me.id&&f.other),out=fs.filter(f=>f.status==="pending"&&f.requester===me.id&&f.other),ok=fs.filter(f=>f.status==="accepted"&&f.other);
const row=(f,btns)=>`<div class="g item row">${av(f.other)}<div class="sp"><b>${esc(f.other.display_name)}</b><br><small>@${esc(f.other.username)}</small></div>${btns}</div>`;
el.innerHTML=`<h2>Requests (${inc.length})</h2>`+(inc.map(f=>row(f,`<button data-acc="${f.id}">Accept</button><button class="s" data-del="${f.id}">✕</button>`)).join("")||`<p class="mut">None right now.</p>`)
+(out.length?`<h2>Sent</h2>`+out.map(f=>row(f,`<button class="s" data-del="${f.id}">Cancel</button>`)).join(""):"")
+`<h2>Friends (${ok.length})</h2>`+(ok.map(f=>row(f,`<button class="s" data-del="${f.id}">Remove</button>`)).join("")||`<p class="mut">Nobody yet.</p>`);
el.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{await sb.from("friendships").update({status:"accepted"}).eq("id",b.dataset.acc);friendsList()});

/* ---------- CHAT ---------- */
let cur=[],replyTo=null,rec=null;
const SV=p=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p}"/></svg>`;
const P={play:"M8 5v14l11-7z",pause:"M6 5h4v14H6zm8 0h4v14h-4z",trash:"M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",mic:"M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z",send:"M3 20.5v-6.8l11-1.7-11-1.7V3.5L22 12 3 20.5z"};
const vpb=a=>`<button type="button" class="vp" ${a}><span class="pl2">${SV(P.play)}</span><span class="pa">${SV(P.pause)}</span></button>`;
const fmt=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const qText=m=>m.kind==="text"?m.body.slice(0,60):m.kind==="voice"?"Voice message":"Photo";
const signed=async(p,sec=300)=>{const{data,error}=await sb.storage.from("chat-media").createSignedUrl(p,sec);if(error){toast("Couldn't load media");return null}return data.signedUrl};
function bubble(m){const mine=m.sender===me.id;let inner,cls="";
if(m.kind==="voice")inner=`<div class="vm" data-d="${m.duration||1}">${vpb('data-v="'+esc(m.media_path)+'"')}<div class="vt"><div class="vk"><i class="vf"></i><b class="vd"></b></div><small class="vl">${fmt(m.duration||0)}</small></div></div>`;

else inner=esc(m.body);
const q=m.reply_to&&cur.find(x=>x.id===m.reply_to);
return`<div class="b ${mine?"me":""}" data-id="${m.id}"><div class="bi${cls}">${q?`<div class="q">${esc(qText(q))}</div>`:""}${inner}</div><small>${time(m.created_at)}${mine?(m.read_at?" \u00b7 Read":" \u00b7 Sent"):""}</small></div>`}
async function loadPhotos(){for(const im of document.querySelectorAll("img.ph:not([src])")){const u=await signed(im.dataset.i,3600);if(u){im.onload=()=>{const l=$("#ml");if(l)l.scrollTop=l.scrollHeight};im.src=u}}}
function addBubble(m){cur.push(m);const l=$("#ml");if(!l)return;const p=l.querySelector("p");if(p)p.remove();l.insertAdjacentHTML("beforeend",bubble(m));l.scrollTop=l.scrollHeight;loadPhotos()}

const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),an=ctx.createAnalyser();an.fftSize=256;ctx.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize);

function draw(){const c=$("#rw");if(!c)return;const x=c.getContext("2d"),W=c.width,H=c.height,n=Math.floor(W/9);x.clearRect(0,0,W,H);

for(let i=0;i<k;i++){let mx=0;const a=Math.floor(i*g),b=Math.max(Math.floor((i+1)*g),a+1);for(let j=a;j<b&&j<peaks.length;j++)mx=Math.max(mx,peaks[j]);

function end(s2){if(mr.state==="inactive")return;sendIt=s2;dur=Math.round(el()/1000);mr.stop()}
const iv=setInterval(()=>{if(!paused){an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));peaks.push(m/128)}

mr.onstop=async()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());ctx.close();if(pv)pv.pause();rp.remove();f.hidden=false;rec=null;

$("#rdel").onclick=()=>end(false);$("#rsd").onclick=()=>end(true);
